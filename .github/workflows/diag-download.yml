name: Diag download
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/diag-download.yml", "desktop/tests/**"]
jobs:
  diag:
    runs-on: windows-latest
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: diag
        env: { SERPER_KEY: "${{ secrets.SERPER_KEY }}", PYTHONIOENCODING: utf-8 }
        shell: cmd
        run: python tests/diag_download.py > diag.txt 2>&1 & type diag.txt
      - name: annotate
        if: always()
        shell: python
        run: |
          ls = [l.rstrip() for l in open("diag.txt", encoding="utf-8", errors="replace") if l.strip() and "propagateSizeHints" not in l]
          for i in range(0, len(ls), 25):
              print("::warning title=diag%d::" % i + "%0A".join(x.replace("%", "%25") for x in ls[i:i+25]))
