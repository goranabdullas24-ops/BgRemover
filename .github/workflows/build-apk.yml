name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Test free image search (same User-Agent as the app)
        run: |
          UA="BgRemover/2.1 (https://github.com/goranabdullas24-ops/BgRemover; Android image app) okhttp/4.12"
          Q="بافڵ تاڵەبانی"
          {
          echo "Search test for: $Q"
          for host in ckb.wikipedia.org en.wikipedia.org; do
            code=$(curl -s -G -o r.json -w '%{http_code}' -A "$UA" --data-urlencode "gsrsearch=$Q" \
              "https://$host/w/api.php?action=query&format=json&generator=search&gsrlimit=5&prop=pageimages&piprop=original")
            n=$(python3 -c "import json;d=json.load(open('r.json'));print(sum(1 for p in d.get('query',{}).get('pages',{}).values() if 'original' in p))" 2>/dev/null || echo "?")
            echo "- $host: HTTP $code, images: $n"
          done
          code=$(curl -s -G -o r.json -w '%{http_code}' -A "$UA" --data-urlencode "gsrsearch=$Q filetype:bitmap" \
            "https://commons.wikimedia.org/w/api.php?action=query&format=json&generator=search&gsrnamespace=6&gsrlimit=10&prop=imageinfo&iiprop=url")
          n=$(python3 -c "import json;d=json.load(open('r.json'));print(len(d.get('query',{}).get('pages',{})))" 2>/dev/null || echo "?")
          echo "- commons.wikimedia.org: HTTP $code, images: $n"
          img=$(python3 -c "import json;d=json.load(open('r.json'));print(next(iter(d['query']['pages'].values()))['imageinfo'][0]['url'])" 2>/dev/null)
          [ -n "$img" ] && echo "- image download: HTTP $(curl -s -o /dev/null -w '%{http_code}' -A "$UA" "$img")"
          BUA="Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Mobile Safari/537.36"
          for q in "$Q" "white tiger"; do
            code=$(curl -s -G -o r.json -w '%{http_code}' -A "$BUA" --data-urlencode "q=$q" \
              "https://api.openverse.org/v1/images/?page=1&page_size=20&mature=false")
            n=$(python3 -c "import json;print(len(json.load(open('r.json')).get('results',[])))" 2>/dev/null || echo "?")
            echo "- openverse ($q): HTTP $code, images: $n"
          done
          } | tee search-test.md

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.7"

      - name: Show Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls $ANDROID_HOME/platforms

      - name: Build release APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Push build log on failure
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Duplicate class|FAILURE|Caused by" -A4 build.log | head -150 > build-errors.txt || true
          tail -80 build.log >> build-errors.txt
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rfq --cached . >/dev/null
          git add -f build-errors.txt
          git commit -qm "build log ${{ github.run_number }}"
          git push -f origin ci-logs

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/BgRemover.apk && ls -la app/build/outputs/apk/release/

      - uses: actions/upload-artifact@v4
        with:
          name: BgRemover-apk
          path: app/build/outputs/apk/release/BgRemover.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: BgRemover v${{ github.run_number }}
          files: app/build/outputs/apk/release/BgRemover.apk
          body_path: search-test.md
