name: Build Windows EXE

on:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.11.1 "pyinstaller-hooks-contrib>=2025.1"

      - name: Test search and full-size download (live network)
        shell: python
        run: |
          import sys; sys.path.insert(0, ".")
          from bgremover import core
          src, res = core.search("بافڵ تاڵەبانی")
          print("search:", src, len(res))
          b, low = core.fetch_image_bytes(res[0].full_url, res[0].thumb_url)
          print("download:", len(b), core.sniff_ext(b), core.open_image(b).size, "low_quality:", low)
          src2, res2 = core.search("white tiger")
          print("search 2:", len(res2))
          assert len(res) > 0 and len(res2) > 0

      - name: Build EXE
        run: |
          python make_icon.py
          pyinstaller --noconfirm --onefile --windowed --name BgRemover --icon icon.ico `
            --collect-data onnxruntime --collect-binaries onnxruntime `
            --hidden-import pillow_heif --hidden-import pillow_avif --hidden-import scipy._cyutility --collect-submodules scipy.ndimage --collect-submodules scipy._lib `
            --exclude-module tkinter --exclude-module matplotlib `
            main.py
          dir dist

      - name: Self-test with Python (no packaging)
        timeout-minutes: 10
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/danielgatis/rembg/main/examples/girl-2.jpg" -OutFile test.jpg
          $out = Join-Path (Get-Location) "py_out.png"
          python main.py --selftest test.jpg $out
          Get-Content selftest.log | ForEach-Object { "::warning title=py-selftest::$_" }

      - name: Self-test the EXE (cutout + upscale)
        timeout-minutes: 8
        run: |
          Remove-Item selftest.log -ErrorAction SilentlyContinue
          $out = Join-Path (Get-Location) "out.png"
          $p = Start-Process -FilePath dist\BgRemover.exe -ArgumentList "--selftest","test.jpg",$out -PassThru
          $ok = $false
          for ($i = 0; $i -lt 24; $i++) {
            Start-Sleep -Seconds 15
            "--- t=$(($i+1)*15)s exited=$($p.HasExited)"
            if (Test-Path selftest.log) { Get-Content selftest.log -Tail 3 }
            if ((Test-Path selftest.log) -and (Select-String -Path selftest.log -Pattern "SELFTEST OK")) { $ok = $true; break }
            if ($p.HasExited) { break }
          }
          if (Test-Path selftest.log) { Get-Content selftest.log | ForEach-Object { "::warning title=exe-selftest::$_" } } else { "::warning title=exe-selftest::no log file, exited=$($p.HasExited) code=$($p.ExitCode)" }
          Get-Process | Where-Object { $_.MainWindowTitle } | ForEach-Object { "::warning title=window::$($_.ProcessName) | $($_.MainWindowTitle)" }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Get-Process BgRemover -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) { exit 1 }

      - name: Smoke-test GUI start
        timeout-minutes: 5
        run: |
          $p = Start-Process -FilePath dist\BgRemover.exe -ArgumentList "--smoke-test" -PassThru
          if (-not $p.WaitForExit(90000)) {
            Get-Process | Where-Object { $_.MainWindowTitle } | ForEach-Object { "::warning title=window::$($_.ProcessName) | $($_.MainWindowTitle)" }
            Stop-Process -Id $p.Id -Force; exit 1 }
          "exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Build installer (Setup)
        timeout-minutes: 20
        run: |
          $ver = (Select-String -Path bgremover\core.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          pyinstaller --noconfirm --onedir --windowed --name BgRemover --icon icon.ico --distpath dist\onedir --workpath build\onedir `
            --collect-data onnxruntime --collect-binaries onnxruntime `
            --hidden-import pillow_heif --hidden-import pillow_avif --hidden-import scipy._cyutility --collect-submodules scipy.ndimage --collect-submodules scipy._lib `
            --exclude-module tkinter --exclude-module matplotlib `
            main.py | Out-Null
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress | Out-Null }
          $env:APP_VERSION = $ver
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc setup.iss
          dir dist

      - name: Test installer (silent install + run installed app)
        timeout-minutes: 8
        run: |
          $setup = Get-ChildItem dist\BgRemover-Setup-*.exe | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/NORESTART" -Wait -PassThru
          "setup exit: $($p.ExitCode)"
          $exe = Join-Path $env:LOCALAPPDATA "Programs\BgRemover\BgRemover.exe"
          if (-not (Test-Path $exe)) { "::warning title=setup::installed exe not found"; exit 1 }
          Remove-Item selftest.log -ErrorAction SilentlyContinue
          $out = Join-Path (Get-Location) "setup_out.png"
          $q = Start-Process -FilePath $exe -ArgumentList "--selftest","test.jpg",$out -PassThru
          if (-not $q.WaitForExit(300000)) { Stop-Process -Id $q.Id -Force }
          if (Test-Path selftest.log) { Get-Content selftest.log | ForEach-Object { "::warning title=setup-selftest::$_" } }
          if (-not (Select-String -Path selftest.log -Pattern "SELFTEST OK")) { exit 1 }

      - name: Package full desktop zip (source + portable exe + setup)
        run: |
          $ver = $env:APP_VERSION
          $root = "pkg\BgRemover-Desktop-v$ver"
          New-Item -ItemType Directory -Force -Path "$root\source" | Out-Null
          Copy-Item dist\BgRemover.exe "$root\BgRemover.exe"
          Copy-Item (Get-ChildItem dist\BgRemover-Setup-*.exe).FullName "$root\"
          Copy-Item -Recurse bgremover,main.py,requirements.txt,make_icon.py,setup.iss "$root\source\"
          Get-ChildItem -Recurse "$root\source" -Include __pycache__ | Remove-Item -Recurse -Force
          @"
          BgRemover Desktop v$ver
          =======================
          BgRemover-Setup-$ver.exe  : install on this computer (desktop + Start menu shortcuts, uninstaller)
          BgRemover.exe             : portable version, runs without installing
          source\                   : full Python source code

          Code + Android app: https://github.com/goranabdullas24-ops/BgRemover
          "@ | Out-File -Encoding utf8 "$root\README.txt"
          Compress-Archive -Path $root -DestinationPath "dist\BgRemover-Desktop-v$ver.zip" -CompressionLevel Optimal
          Compress-Archive -Path dist\BgRemover.exe -DestinationPath dist\BgRemover-Desktop.zip -CompressionLevel Optimal
          dir dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ github.run_number }}
          name: BgRemover Desktop v${{ github.run_number }}
          make_latest: false
          files: |
            desktop/dist/BgRemover.exe
            desktop/dist/BgRemover-Desktop.zip
            desktop/dist/BgRemover-Setup-*.exe
            desktop/dist/BgRemover-Desktop-v*.zip
