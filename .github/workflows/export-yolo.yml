name: Export YOLO person-instance model

on:
  push:
    paths: [".github/workflows/export-yolo.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install ultralytics onnx onnxslim onnxruntime
      - name: Export
        run: |
          yolo export model=yolo11n-seg.pt format=onnx imgsz=640 opset=17 simplify=True
          python -c "import onnxruntime as o;s=o.InferenceSession('yolo11n-seg.onnx');print([(i.name,i.shape) for i in s.get_inputs()],[(x.name,x.shape) for x in s.get_outputs()])"
          mkdir -p model && cp yolo11n-seg.onnx model/yolo11n_seg.onnx && ls -l model
      - name: Commit model
        run: |
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git pull --rebase
          git add model/yolo11n_seg.onnx
          git commit -m "Add YOLO11n-seg ONNX (person instance segmentation)" || echo nothing
          git push
